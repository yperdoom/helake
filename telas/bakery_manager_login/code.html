<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bakery Manager Login</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS with Config -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#ec7f13",
              "background-light": "#f8f7f6",
              "background-dark": "#221910",
              "surface-light": "#ffffff",
              "surface-dark": "#2c2014",
              "text-main": "#221910",
              "text-muted": "#9a734c",
            },
            fontFamily: {
              "display": ["Work Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased selection:bg-primary/20">
<div class="relative flex min-h-screen w-full flex-col justify-center overflow-hidden bg-cover bg-center py-12 sm:px-6 lg:px-8" data-alt="Blurred bakery kitchen background with flour and dough" style='background-image: linear-gradient(rgba(248, 247, 246, 0.85), rgba(248, 247, 246, 0.95)), url("https://lh3.googleusercontent.com/aida-public/AB6AXuCIilbXnfVMp6dkVPC877k0MMKHr8mqxwQKLdMmzWKOZm7zJ_-T1GsFDC3xFa82CrX6kagi_bEcC7W_Jiwln6v5rfYS06ev8-9VD5mEE5x1-UEhbid_VPk_wq7TvuG-hCg2ZzCHjGlIDHfSZRQ4xYy-hCkxBkZrooPr7d0qCnq7i0Jr5MLeu7zwmjMW_wl2TgnQV_miHMe35B1utqW4e6f6G7gI2MIOs3kym7gAsy-2jUXYBnJ9NZliMnNISHprZoSIZPG9w6xQqNz9");'>
<!-- Decorative subtle pattern overlay -->
<div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10 pointer-events-none" data-alt="Subtle geometric pattern overlay"></div>
<div class="relative sm:mx-auto sm:w-full sm:max-w-md z-10">
<!-- Logo / Brand Area -->
<div class="flex flex-col items-center justify-center mb-8 gap-3">
<div class="flex items-center justify-center w-16 h-16 rounded-full bg-primary/10 text-primary mb-2 shadow-sm ring-1 ring-primary/20">
<span class="material-symbols-outlined text-4xl">bakery_dining</span>
</div>
<h2 class="text-center text-3xl font-black tracking-tight text-text-main dark:text-white">
                    Bakery Manager
                </h2>
<p class="text-center text-sm font-medium text-text-muted dark:text-gray-400 max-w-[80%]">
                    Sign in to manage your orders, inventory, and costs efficiently.
                </p>
</div>
<!-- Login Card -->
<div class="bg-surface-light dark:bg-surface-dark py-8 px-4 shadow-[0_8px_30px_rgb(0,0,0,0.04)] ring-1 ring-black/5 sm:rounded-xl sm:px-10">
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div>
<label class="block text-sm font-semibold leading-6 text-text-main dark:text-gray-200" for="email">
                            Email address
                        </label>
<div class="relative mt-2 rounded-lg shadow-sm">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
<span class="material-symbols-outlined text-text-muted text-[20px]">mail</span>
</div>
<input autocomplete="email" class="block w-full rounded-lg border-0 py-3 pl-10 text-text-main ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6 bg-background-light dark:bg-background-dark dark:ring-gray-700 dark:text-white transition-all duration-200" id="email" name="email" placeholder="chef@bakery.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex items-center justify-between">
<label class="block text-sm font-semibold leading-6 text-text-main dark:text-gray-200" for="password">
                                Password
                            </label>
<div class="text-sm">
<a class="font-semibold text-primary hover:text-orange-600 transition-colors" href="#">Forgot password?</a>
</div>
</div>
<div class="relative mt-2 rounded-lg shadow-sm">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
<span class="material-symbols-outlined text-text-muted text-[20px]">lock</span>
</div>
<input autocomplete="current-password" class="block w-full rounded-lg border-0 py-3 pl-10 text-text-main ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6 bg-background-light dark:bg-background-dark dark:ring-gray-700 dark:text-white transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<div>
<button class="flex w-full justify-center rounded-lg bg-primary px-3 py-3.5 text-sm font-bold leading-6 text-white shadow-sm hover:bg-orange-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary transition-all duration-200 transform active:scale-[0.98]" type="submit">
                            Sign in
                        </button>
</div>
</form>
<!-- Footer / Sign Up Link -->
<div class="mt-8 border-t border-gray-100 dark:border-gray-700 pt-6">
<p class="text-center text-sm leading-5 text-gray-500 dark:text-gray-400">
                        Don't have an account?
                        <a class="font-semibold leading-6 text-primary hover:text-orange-600 ml-1 transition-colors" href="#">Contact Support</a>
</p>
</div>
</div>
<!-- Simple Footer Text -->
<div class="mt-8 text-center">
<p class="text-xs text-text-muted/70">
                    © 2023 Bakery Manager System. All rights reserved.
                </p>
</div>
</div>
</div>
</body></html>
